server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: dargent-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # M5 S2: the Redis cache is an OPT-IN optimization (DARGENT_CACHE_REDIS_ENABLED=false by default →
  # fail-open trivially, DB direct, zero Redis beans). Boot's Spring Data Redis auto-config runs on
  # classpath presence alone, so it is excluded here; the cache's own conditional config
  # (CacheConfiguration) provides the client ONLY when the cache is enabled.
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisHealthContributorAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DARGENT_DB_HOST:localhost}:${DARGENT_DB_PORT:5432}/${DARGENT_DB_NAME:dargent}
    username: ${DARGENT_DB_USER:dargent}
    password: ${DARGENT_DB_PASSWORD:dargent}
  flyway:
    # Gap-versioned per-module migrations (payments V1xx, ledger V2xx, notifications V3xx) —
    # each module owns its schema; zero cross-schema FK/JOIN (design.md §5, D2).
    locations: classpath:db/migration/payments, classpath:db/migration/ledger, classpath:db/migration/notifications

dargent:
  psp:
    base-url: ${PSP_BASE_URL:http://psp-simulator:8090}
    callback-url: ${PSP_CALLBACK_URL:http://api-blue:8080/webhooks/psp}
    create-max-attempts: ${PSP_CREATE_MAX_ATTEMPTS:3}
    create-backoff-base-ms: ${PSP_CREATE_BACKOFF_BASE_MS:200}
  # Webhook abuse controls (E15 S1, DEBT-8): generous defaults that never trip in demo/smoke;
  # env-tunable per spec §4. Rate limit = hand-rolled per-IP token bucket (Q-batch 2026-09-08).
  webhook:
    rate-limit:
      capacity: ${DARGENT_WEBHOOK_RATE_LIMIT_CAPACITY:100}
      refill-per-second: ${DARGENT_WEBHOOK_RATE_LIMIT_REFILL_PER_SECOND:0.5}
    body-cap-bytes: ${DARGENT_WEBHOOK_BODY_CAP_BYTES:65536}
  pix:
    profile:
      pix-key: ${DARGENT_PIX_KEY:dargent-dev-receber@example.com}
      receiver-name: ${DARGENT_RECEIVER_NAME:Dargent Dev LTDA}
      receiver-city: ${DARGENT_RECEIVER_CITY:SAO PAULO}
  # M5 S2 (m5-spec §4): Redis read cache for the idempotent-replay path. CARVED DEFAULTS — default
  # OFF (DB direct, fail-open trivially); URI and TTL are connection/ttl surface only.
  cache:
    redis:
      enabled: ${DARGENT_CACHE_REDIS_ENABLED:false}
      uri: ${DARGENT_CACHE_REDIS_URI:redis://localhost:6379}
      ttl: ${DARGENT_CACHE_REDIS_TTL:PT5M}

management:
  server:
    port: ${DARGENT_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      # E13 S4 R2: readiness = ALL contributors (db + diskSpace + the SNS/SQS spine indicators,
      # registered only when the spine is enabled). Boot's default readiness group carries only
      # readinessState/ping — redefining membership here makes /actuator/health/readiness the
      # real deploy gate the blue-green canary consumes. Liveness keeps its default (process-only).
      group:
        readiness:
          include: '*'
          show-details: never
  # N12 (E12 S4): SLO buckets from slos.md thresholds — the whole rider. p50/p95/p99 readable from
  # the bucket histogram; publish-percentile-histogram keeps bucket boundaries exact for downstream
  # tooling. MetricsScrapeIT asserts the 0.25s bucket line exists.
  metrics:
    distribution:
      slo:
        http:
          server:
            requests: 100ms,250ms,1s
      publish-percentile-histogram: true

---

spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
