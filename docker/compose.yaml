name: dargent

# M0 topology (design.md §12). Blue-green flip scripts (canary/cutover/rollback) land at M4 in deploy/.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DARGENT_DB_NAME:-dargent}
      POSTGRES_USER: ${DARGENT_DB_USER:-dargent}
      POSTGRES_PASSWORD: ${DARGENT_DB_PASSWORD:-dargent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DARGENT_DB_USER:-dargent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      DEBUG: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sns\": \"(available|running)\"' && curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./../deploy/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    # Stateless by design: queues re-provision at app boot from M2 on (ADR-0015).

  api-blue:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: dargent-api:compose
    environment: &api-env
      DARGENT_DB_HOST: postgres
      DARGENT_DB_PORT: 5432
      DARGENT_DB_NAME: ${DARGENT_DB_NAME:-dargent}
      DARGENT_DB_USER: ${DARGENT_DB_USER:-dargent}
      DARGENT_DB_PASSWORD: ${DARGENT_DB_PASSWORD:-dargent}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  api-green:
    image: dargent-api:compose
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  psp-simulator:
    build:
      context: ..
      dockerfile: apps/psp-simulator/Dockerfile
    image: dargent-psp-simulator:compose
    environment:
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-dev-only-secret}
      CHAOS_WEBHOOK_DUPLICATE: ${CHAOS_WEBHOOK_DUPLICATE:-false}
      CHAOS_WEBHOOK_DELAY_MS: ${CHAOS_WEBHOOK_DELAY_MS:-0}
      CHAOS_WEBHOOK_DROP_RATE: ${CHAOS_WEBHOOK_DROP_RATE:-0.0}
      CHAOS_PSP_ERROR_RATE: ${CHAOS_PSP_ERROR_RATE:-0.0}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-blue
      - api-green
    restart: unless-stopped

volumes:
  pgdata:
