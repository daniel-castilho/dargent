name: dargent

# M0 topology (design.md §12). Blue-green flip scripts (canary/cutover/rollback) live in
# scripts/deploy.sh + scripts/rollback.sh (E12 S0); weights are rendered into deploy/runtime/nginx.conf.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DARGENT_DB_NAME:-dargent}
      POSTGRES_USER: ${DARGENT_DB_USER:-dargent}
      POSTGRES_PASSWORD: ${DARGENT_DB_PASSWORD:-dargent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DARGENT_DB_USER:-dargent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      DEBUG: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sns\": \"(available|running)\"' && curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - ./../deploy/localstack-init.sh:/etc/localstack/init/ready.d/localstack-init.sh:ro
    # Stateless by design: queues re-provision at app boot from M2 on (ADR-0015).

  api-blue:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: dargent-api:compose
    environment: &api-env
      DARGENT_DB_HOST: postgres
      DARGENT_DB_PORT: 5432
      DARGENT_DB_NAME: ${DARGENT_DB_NAME:-dargent}
      DARGENT_DB_USER: ${DARGENT_DB_USER:-dargent}
      DARGENT_DB_PASSWORD: ${DARGENT_DB_PASSWORD:-dargent}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DARGENT_PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-dev-only-secret}
      PSP_CALLBACK_URL: ${PSP_CALLBACK_URL:-http://nginx:80/webhooks/psp}
      # E15 S1 (DEBT-8): webhook abuse controls, env-tunable wall-clock values (defaults generous).
      DARGENT_WEBHOOK_RATE_LIMIT_CAPACITY: ${DARGENT_WEBHOOK_RATE_LIMIT_CAPACITY:-100}
      DARGENT_WEBHOOK_RATE_LIMIT_REFILL_PER_SECOND: ${DARGENT_WEBHOOK_RATE_LIMIT_REFILL_PER_SECOND:-0.5}
      DARGENT_WEBHOOK_BODY_CAP_BYTES: ${DARGENT_WEBHOOK_BODY_CAP_BYTES:-65536}
      DARGENT_RECONCILER_ENABLED: ${DARGENT_RECONCILER_ENABLED:-false}
      DARGENT_RECONCILER_SCAN_MS: ${DARGENT_RECONCILER_SCAN_MS:-60000}
      DARGENT_RECONCILER_BACKOFF_MS: ${DARGENT_RECONCILER_BACKOFF_MS:-60000,300000,900000,3600000}
      # Events spine (E6/E7): off by default (payments-path smoke does not need them); the
      # proof-daily job turns the full spine on so money reaches the ledger and the proof has
      # a journal to verify.
      DARGENT_RELAY_ENABLED: ${DARGENT_RELAY_ENABLED:-false}
      DARGENT_RELAY_POLL_MS: ${DARGENT_RELAY_POLL_MS:-1000}
      DARGENT_RELAY_WORKERS: ${DARGENT_RELAY_WORKERS:-2}
      DARGENT_RELAY_BATCH: ${DARGENT_RELAY_BATCH:-32}
      DARGENT_RELAY_MAX_ATTEMPTS: ${DARGENT_RELAY_MAX_ATTEMPTS:-3}
      DARGENT_OUTBOX_RETENTION_DAYS: ${DARGENT_OUTBOX_RETENTION_DAYS:-7}
      DARGENT_EVENTS_TOPIC_ARN: ${DARGENT_EVENTS_TOPIC_ARN:-arn:aws:sns:us-east-1:000000000000:dargent-payments-events.fifo}
      DARGENT_EVENTS_PUBLISH_TIMEOUT_MS: ${DARGENT_EVENTS_PUBLISH_TIMEOUT_MS:-2000}
      DARGENT_LEDGER_CONSUMER_ENABLED: ${DARGENT_LEDGER_CONSUMER_ENABLED:-false}
      DARGENT_LEDGER_QUEUE_URL: ${DARGENT_LEDGER_QUEUE_URL:-http://localstack:4566/000000000000/dargent-payments-ledger.fifo}
      DARGENT_LEDGER_POLL_MS: ${DARGENT_LEDGER_POLL_MS:-1000}
      DARGENT_NOTIFS_QUEUE_URL: ${DARGENT_NOTIFS_QUEUE_URL:-http://localstack:4566/000000000000/dargent-payments-notify.fifo}
      # E13 R3: ledger admin gate (rebuild/proof/settlements). Default EMPTY = 404-hidden
      # (contract — never change the default without owner sign-off). Proof-daily exports the
      # job-scoped smoke key here so P5 can call the (now admin-gated) proof endpoint.
      DARGENT_LEDGER_ADMIN_KEY: ${DARGENT_LEDGER_ADMIN_KEY:-}
      # E14 S3 (Q2 Proposal A): outbox admin gate (republish/requeue). Default EMPTY = 404-hidden
      # (same posture as the ledger admin key above — never change the default without owner sign-off).
      # scripts/republish-outbox.sh exports the operator's key here.
      DARGENT_OUTBOX_ADMIN_KEY: ${DARGENT_OUTBOX_ADMIN_KEY:-}
      DARGENT_EXPIRATION_ENABLED: ${DARGENT_EXPIRATION_ENABLED:-false}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  api-green:
    image: dargent-api:compose
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  psp-simulator:
    build:
      context: ..
      dockerfile: apps/psp-simulator/Dockerfile
    image: dargent-psp-simulator:compose
    environment:
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-dev-only-secret}
      CHAOS_WEBHOOK_DUPLICATE: ${CHAOS_WEBHOOK_DUPLICATE:-false}
      CHAOS_WEBHOOK_DELAY_MS: ${CHAOS_WEBHOOK_DELAY_MS:-0}
      CHAOS_WEBHOOK_DROP_RATE: ${CHAOS_WEBHOOK_DROP_RATE:-0.0}
      CHAOS_PSP_ERROR_RATE: ${CHAOS_PSP_ERROR_RATE:-0.0}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    command: nginx -c /etc/nginx/runtime/nginx.conf -g "daemon off;"
    ports:
      - "8080:80"
    volumes:
      # Bind the DIRECTORY, not the file: a single-file bind mount pins the inode at mount time, so an
      # atomic replace (mv/sed -i/editor) orphans the old inode and reloads silently read stale config.
      # Directory binds resolve by name on every access — deploy relays work with plain `nginx -s reload`
      # (research: docker bind-mile inode pinning, E12 S2).
      - ./../deploy/runtime:/etc/nginx/runtime:ro
    depends_on:
      - api-blue
      - api-green
    restart: unless-stopped

  # E12 S6 (optional convenience, not a contract): single Prometheus scraping both colors'
  # management ports. Opt-in via `docker compose --profile metrics up -d`.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["metrics"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # E15 S2: alert rules mounted for check/tests parity (CI runs promtool on the same files).
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports:
      - "9095:9090"
    restart: unless-stopped

  # E16 S1: Alertmanager — severity routes to a webhook-logger stub (NO pager, NO external
  # sink; spec §2 non-goal). The stub is a real HTTP target so "alerts flowing" is provable.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["metrics"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  # E16 S1: the stub receiver — one-file stdlib HTTP sink that logs every alert group.
  webhook-logger:
    build:
      context: ./alertmanager/webhook-logger
    image: dargent-webhook-logger:compose
    profiles: ["metrics"]
    ports:
      - "9096:9095"
    restart: unless-stopped

volumes:
  pgdata:
