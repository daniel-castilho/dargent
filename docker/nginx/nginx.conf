# Reverse proxy for the blue-green fleets (design.md §11.2).
# M4 deploy scripts edit a RUNTIME COPY of this file and reload; the versioned template is never mutated.
# Gotchas baked in (lessons.md #9, #10): `down` instead of `weight=0`; runtime DNS re-resolution
# so recreated containers are picked up without reload.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS: resolve fleet containers at runtime, not once at startup.
  resolver 127.0.0.11 valid=10s;

  upstream dargent_api {
    zone dargent_api 64k;
    server api-blue:8080 resolve;
    server api-green:8080 resolve;
    keepalive 32;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://dargent_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_next_upstream error timeout;
    }
  }
}
