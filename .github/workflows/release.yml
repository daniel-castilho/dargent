# E14 S2 — Release workflow. Triggered ONLY by an annotated tag `v*` (runbook §1 tag flow).
# Contracts (§3): gates NEVER skip the release path; SBOM = the pushed image digest; tag
# immutability (fix-forward via vX.Y.Z+1, never move a tag). GITHUB_TOKEN only — no PATs.
# E14 S3/S4: the gates include the RESTORE DRILL (runbook §6) — a release ships only from a
# backup chain that has been restored + verified in the same run ("the drill is the deliverable").
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Architecture boundary check (imports + domain purity)
        run: bash scripts/check-boundaries.sh

      - name: Migration gate tests (TD-33)
        run: |
          python3 scripts/migration_gate.py selftest
          bash scripts/test-migration-gate.sh

      - name: Build, unit and integration tests
        run: ./mvnw -B verify

      - name: Cache OWASP NVD data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (SHA-pinned, design §11.1)
        with:
          path: ~/.m2/dependency-check-data
          key: owasp-nvd-v1
          restore-keys: owasp-nvd-

      - name: OWASP Dependency-Check (NVD keyed, cached)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          # E16 S5 fix (mirrors ci.yml): -DnvdApiKey ONLY when the secret exists — an empty
          # key string is invalid for dependency-check 13; keyless stays throttled-but-working.
          KEY_ARGS=()
          if [[ -n "${NVD_API_KEY:-}" ]]; then KEY_ARGS+=(-DnvdApiKey="$NVD_API_KEY"); fi
          attempt() { ./mvnw -B dependency-check:aggregate -DskipTests "${KEY_ARGS[@]}" "$@"; }
          if ! attempt; then
            echo "OWASP attempt 1 failed — retrying once in 60s (NVD sync flakiness, documented P2 policy)"
            sleep 60
            attempt || { echo "OWASP attempt 2 failed — FAILING THE JOB (never silent-pass)"; exit 1; }
          fi

      - name: Coverage floors (payments/ledger/shared/notifications/api)
        run: bash scripts/check-coverage.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'

  # E14 S4: the restore drill IS part of the release gates (runbook §2 item 4 — a release only
  # ships from a backup chain restored + verified in the same run).
  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build compose images
        run: |
          docker build -t dargent-api:compose -f apps/api/Dockerfile .
          docker build -t dargent-psp-simulator:compose -f apps/psp-simulator/Dockerfile .

      - name: Restore drill — backup → destroy → restore → verify (RTO measured)
        run: bash scripts/ci-restore-drill.sh

      - name: Upload drill artifacts (always — the record is the deliverable)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restore-drill
          path: |
            /tmp/restore-drill/**
          if-no-files-found: ignore

  release:
    needs: [gates, restore-drill]
    runs-on: ubuntu-latest
    # contents: write — create the GitHub Release; packages: write — push the image.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve semver from tag
        id: semver
        run: |
          tag="${GITHUB_REF_NAME}"            # e.g. v1.0.0, v1.0.0-rc1
          semver="${tag#v}"                   # strip the leading v
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "Pushing/attaching semver: $semver"

      - name: Build API image
        run: docker build -t dargent-api:${{ github.sha }} -f apps/api/Dockerfile .

      - name: Non-root gate (must fail on UID 0)
        run: |
          out="$(docker run --rm --entrypoint id dargent-api:${{ github.sha }})"
          echo "$out"
          if echo "$out" | grep -q 'uid=0('; then
            echo "FATAL: image runs as root (UID 0)"
            exit 1
          fi
          echo "OK: image runs non-root"

      - name: Trivy pass 2 — HIGH/CRITICAL gate (must be clean before shipping)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dargent-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.7.0 (SHA-pinned, supply-chain per threat-model)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push semver image
        id: push
        run: |
          dest="ghcr.io/daniel-castilho/dargent-api:${{ steps.semver.outputs.semver }}"
          docker tag dargent-api:${{ github.sha }} "$dest"
          docker push "$dest"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$dest")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed: $dest @ $digest"

      # Contract §3.0: SBOM of the EXACT pushed image digest (not a sibling build). Scan by
      # digest reference so the SBOM provably describes the image the registry serves.
      - name: SBOM CycloneDX of the pushed digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: sbom-dargent-api-${{ steps.semver.outputs.semver }}.json

      # Runbook §1: the Release carries THE jar of the shipped image — extract it from the built
      # image instead of attaching a sibling ./mvnw artifact (builds must match bit-for-bit).
      - name: Extract the jar from the image
        run: |
          cid="$(docker create dargent-api:${{ github.sha }})"
          docker cp "$cid:/app/app.jar" dargent-api-${{ steps.semver.outputs.semver }}.jar
          docker rm "$cid"
          sha256sum dargent-api-${{ steps.semver.outputs.semver }}.jar

      - name: Compose release notes
        run: |
          # Runbook §1: notes = tag annotation + auto-generated changelog section (--notes
          # prepends when --generate-notes is also given). The file is written WITHOUT a
          # GITHUB_OUTPUT multiline heredoc (delimiter must be a standalone line — a value
          # lacking a trailing newline glues the terminator and breaks the command file).
          annotation="$(git show -s --format=%B "${{ steps.semver.outputs.tag }}")"
          printf 'Image: `%s`\n\n' "${{ steps.push.outputs.digest }}" > notes.md
          printf 'Tag: `%s` · Semver tag: `%s`\n\n' \
            "${{ steps.semver.outputs.tag }}" "${{ steps.semver.outputs.semver }}" >> notes.md
          printf '%s\n\n' "$annotation" >> notes.md
          printf 'Assets: API jar (extracted from the shipped image) + CycloneDX SBOM of the exact pushed digest.\n' >> notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --notes prepends to the auto-generated changelog (per gh release create --help).
          notes="$(cat notes.md)"
          gh release create "${{ steps.semver.outputs.tag }}" \
            "dargent-api-${{ steps.semver.outputs.semver }}.jar" \
            "sbom-dargent-api-${{ steps.semver.outputs.semver }}.json" \
            --title "Dargent ${{ steps.semver.outputs.semver }}" \
            --notes "$notes" \
            --generate-notes