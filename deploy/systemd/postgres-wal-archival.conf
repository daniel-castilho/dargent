# WAL archival (runbook §6: 15-minute RPO) — host-side PostgreSQL config, shipped not CI-drilled.
#
# Dargent runs postgres in compose (docker/compose.yaml). The 15-min WAL policy is met by
# archiving from the postgres container's volume. This override file is shipped for the host
# operator; the drill record (docs/drills/restore-*.md) declares WAL/PITR shipped-not-drilled
# honestly, per the E14 S3 contract.
#
# Install: copy to the postgres data volume's postgresql.conf.d/ (or compose env
# POSTGRES_INITDB_ARGS + command args), then restart postgres. archive_command ships completed
# WAL segments to the backup volume; rotation keeps 8 windows (same policy as dumps).

archive_mode = on
archive_command = 'test ! -f /var/backups/dargent/wal/%f && cp %p /var/backups/dargent/wal/%f'
archive_timeout = 900
wal_level = replica
